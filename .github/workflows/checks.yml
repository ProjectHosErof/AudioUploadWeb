# Checks on every pull request (and on pushes to the trunk branches):
# the API's types, unit tests and vocabulary checks, and the site's types,
# lint and end-to-end tests. Needs no secrets: the end-to-end tests run
# against a local build with every network call faked (phe-landing-page/e2e).

name: Checks

on:
  pull_request:
  push:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (types, tests, vocabulary)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: audio-upload-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: audio-upload-api/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run check:vocab
      - run: npm run check:placement

  web:
    name: Site (types, lint, end-to-end + accessibility)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: phe-landing-page
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: phe-landing-page/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload the test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: phe-landing-page/playwright-report
          retention-days: 14
